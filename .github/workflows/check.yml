name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Media tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg openssl
      - name: Media tools (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Media tools (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --yes --no-progress }
      - name: TLS qualification tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $tlsTools = 'C:/Program Files/Git/usr/bin'
            if (-not (Test-Path -LiteralPath "$tlsTools/openssl.exe")) { throw 'OpenSSL is required for real PostgreSQL TLS qualification' }
            $tlsTools | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
