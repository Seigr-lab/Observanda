name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Source checks / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: ${{ matrix.suite }} ${{ matrix.shard }}/8 / ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        os: [ubuntu-24.04, windows-latest]
        suite: [native, browser]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.suite == 'native' && 120 || 60 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Media tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg openssl
      - name: Media tools (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --yes --no-progress }
      - name: TLS qualification tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $tlsTools = 'C:/Program Files/Git/usr/bin'
            if (-not (Test-Path -LiteralPath "$tlsTools/openssl.exe")) { throw 'OpenSSL is required for real PostgreSQL TLS qualification' }
            $tlsTools | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      # Use one native worker per job to avoid competing test files. Capacity
      # diagnostics record observed load; the machine is not assumed idle.
      - name: Native tests
        if: matrix.suite == 'native'
        run: node scripts/test.js --test-concurrency=1 --test-shard=${{ matrix.shard }}/8 "test/*.test.js"
      - name: Install browser
        if: matrix.suite == 'browser'
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        if: matrix.suite == 'browser'
        run: node scripts/test.js --browser --shard=${{ matrix.shard }}/8 --forbid-only
